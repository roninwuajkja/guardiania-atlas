<!doctype html>
<html lang="es">
<head>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>IA Guardian · Página no encontrada</title>
<style>
  :root { --ink:#10211b; --muted:#5c6f66; --paper:#f4f1e8; --green:#0b3d2e; --lime:#d8f29b; --line:#d8d3c3; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(900px 420px at 15% 0%, #dff4e5, transparent 60%), var(--paper); color:var(--ink); font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width:640px; background:#fffdf7; border:1px solid var(--line); border-radius:24px; padding:36px; }
  .kicker { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--green); font-weight:750; }
  h1 { margin:10px 0 12px; color:var(--green); font-size:clamp(32px,6vw,56px); line-height:.98; letter-spacing:-.04em; }
  p { color:var(--muted); font-size:17px; line-height:1.5; }
  a { display:inline-block; margin-top:12px; background:var(--green); color:var(--lime); text-decoration:none; font-weight:750; padding:11px 16px; border-radius:999px; }
</style>
</head>
<body>
<main>
  <div class="kicker">IA Guardian · Atlas</div>
  <h1>Esa página no existe.</h1>
  <p>El enlace puede estar mal escrito o el diagrama cambió de nombre. Vuelve al índice para elegir uno de los 70 diagramas.</p>
  <a href="./">Volver al atlas</a>
</main>
</body>
